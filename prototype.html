<style>
  :root{--ink:#0E1E3C;--dark:#0B0F19;--side:#0F1522;--line:rgba(255,255,255,.1);--muted:#9AA3B5;--accent:#E0A030;--bg:#E7EBF1;--blue:#0046CE}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Inter",-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#121A2E;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
  .app.full{grid-template-columns:0 1fr}
  .app.full .side{visibility:hidden}

  /* Sidebar */
  .side{background:var(--side);color:#fff;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;border-bottom:1px solid var(--line)}
  .brand img{height:30px;width:auto}
  .brand span{font-size:.82rem;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
  .search{padding:14px 16px;border-bottom:1px solid var(--line)}
  .search input{width:100%;font:inherit;font-size:.9rem;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
  .search input::placeholder{color:#7E8799}
  .search input:focus{outline:0;border-color:var(--accent)}
  .list{flex:1;overflow:auto;padding:8px 0 24px;scrollbar-width:thin;scrollbar-color:#2A3346 transparent}
  .grp>button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:#C9D0DC;padding:12px 20px 8px;font-size:.78rem;font-weight:600;letter-spacing:.02em;text-align:left}
  .grp>button span{color:#6F7889;font-weight:500}
  .grp>button::after{content:"";width:7px;height:7px;border-right:1.5px solid #6F7889;border-bottom:1.5px solid #6F7889;transform:rotate(45deg);margin-left:8px;transition:transform .2s}
  .grp.closed>button::after{transform:rotate(-45deg)}
  .grp.closed ul{display:none}
  .grp ul{list-style:none;margin:0;padding:0 8px}
  .grp li button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:#AEB6C4;padding:7px 12px;font-size:.88rem;line-height:1.35;border-radius:0 4px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp li button:hover{background:rgba(255,255,255,.05);color:#fff}
  .grp li button[aria-current="true"]{color:#fff;background:rgba(224,160,48,.12);border-left-color:var(--accent)}
  .grp li[hidden]{display:none}
  .side-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:.75rem;color:#6F7889;line-height:1.6}
  .side-foot kbd{font:inherit;color:#C9D0DC;border:1px solid var(--line);border-radius:3px;padding:0 4px}

  /* Top bar */
  .main{display:grid;grid-template-rows:auto 1fr;min-width:0;overflow:hidden}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;min-width:0;background:#fff;border-bottom:1px solid #D7DDE6}
  .icon{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #D7DDE6;border-radius:6px;color:var(--ink)}
  .icon:hover{border-color:var(--ink)}
  .icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .now{min-width:0;flex:1}
  .now b{display:block;font-weight:600;color:var(--ink);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now span{display:block;font-size:.78rem;color:#6B7484;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:inline-flex;border:1px solid #D7DDE6;border-radius:6px;overflow:hidden;background:#fff}
  .seg button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-right:1px solid #D7DDE6;padding:0 12px;height:34px;font-size:.84rem;color:#3B4558}
  .seg button:last-child{border-right:0}
  .seg button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .pos{font-size:.82rem;color:#6B7484;font-variant-numeric:tabular-nums;white-space:nowrap}
  .open{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;background:var(--ink);color:#fff;text-decoration:none;font-size:.85rem;font-weight:500}
  .open:hover{background:var(--blue)}

  /* Stage */
  .stage{position:relative;overflow:hidden;min-width:0;display:flex;justify-content:center;align-items:flex-start;padding:24px}
  .frame{position:relative;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 60px -24px rgba(11,15,25,.35);transform-origin:top left;overflow:hidden}
  .frame.mobile,.frame.tablet{border-radius:28px;outline:10px solid #11161F}
  .vp{transform-origin:top left;border:0;display:block;background:#F5F7FA}
  .size{position:absolute;right:20px;bottom:14px;font-size:.75rem;color:#6B7484;background:rgba(255,255,255,.8);padding:3px 8px;border-radius:4px}
  .loading{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;animation:load 1s linear infinite;opacity:0;transition:opacity .2s}
  .loading.on{opacity:1}
  @keyframes load{from{background-position:-50% 0}to{background-position:150% 0}}
  @media (prefers-reduced-motion:reduce){.loading{animation:none}}
  .icon,.seg,.open{flex:none}
  @media (max-width:1280px){.seg button span{display:none}.seg button{padding:0 10px}}
  @media (max-width:1100px){.pos{display:none}}
  @media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.seg button span{display:none}}
</style>
</head>

    }catch(e){}
  });
  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){setDev(b.dataset.d);};});
  function setDev(d){device=d;document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.d===d?'true':'false');});fit();mark(idx);}
  document.getElementById('prev').onclick=function(){go(idx-1);};
  document.getElementById('next').onclick=function(){go(idx+1);};
  var app=document.getElementById('app'),tg=document.getElementById('toggle');
  function toggle(){var f=app.classList.toggle('full');tg.setAttribute('aria-label',f?'Show page list':'Hide page list');setTimeout(fit,0);}
  tg.onclick=toggle;
  document.getElementById('q').addEventListener('input',function(){
    var q=this.value.trim().toLowerCase();
    DATA.forEach(function(g){var any=false;g.items.forEach(function(it){var ok=!q||(it.n+' '+it.t+' '+it.f).toLowerCase().indexOf(q)>-1;it.li.hidden=!ok;if(ok)any=true;});g.el.style.display=any?'':'none';if(q)g.el.classList.remove('closed');});
  });
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT')return;
    if(e.key==='ArrowDown'||e.key===']'){e.preventDefault();go(idx+1);}
    else if(e.key==='ArrowUp'||e.key==='['){e.preventDefault();go(idx-1);}
    else if(e.key==='f'||e.key==='F'){toggle();}
    else if(e.key>='1'&&e.key<='4'){setDev(['desktop','laptop','tablet','mobile'][+e.key-1]);}
  });
  window.addEventListener('resize',fit);
  var h=decodeURIComponent(location.hash.slice(1)),start=0;
  if(h){var parts=h.split('@');var m=flat.filter(function(x){return x.f===parts[0];})[0];if(m)start=m.i;if(parts[1]&&DEV[parts[1]])device=parts[1];}
  setDev(device);go(start);
})();
</script>
</body>
</html>
